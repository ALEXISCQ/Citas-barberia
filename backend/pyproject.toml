[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citas-barberia-backend"
version = "0.1.0"
description = "API de citas para barbería con FastAPI y MongoDB"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "motor>=3.6.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[project.optional-dependencies]
testing = [
  "pytest>=8.4.0",
  "pytest-asyncio>=0.22.0",
  "httpx>=0.27.0"
]
